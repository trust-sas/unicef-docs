version: '3'

services:
  db:
    image: postgres:17-alpine
    container_name: unicef_docs-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: unicef_docs
      POSTGRES_PASSWORD: unicef_docs
      POSTGRES_DB: unicef_docs_db
    ports:
      - 5435:5432
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    networks:
      - tcth-network
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U unicef_docs -d unicef_docs']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tcth-network:
    driver: bridge

volumes:
  postgres-data-prod:
